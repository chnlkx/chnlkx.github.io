# --- 简介文本 (支持 Markdown 语法) ---
about: |
  Hi! I am a Ph.D. candidate at the Department of Physics, **Tsinghua University**, advised by Prof. Fei Gao. 
  I am a member of the **XENON Collaboration**, working on the frontiers of dark matter direct detection and neutrino physics.

  My research focuses on the **XENONnT experiment** at the Laboratori Nazionali del Gran Sasso (LNGS). 
  I lead the analysis effort for the **Solar Boron-8 Coherent Elastic Neutrino-Nucleus Scattering (CENS)** measurement 
  and the search for light WIMPs. I specialize in event reconstruction, background modeling (specifically accidental coincidence), 
  and statistical inference.

