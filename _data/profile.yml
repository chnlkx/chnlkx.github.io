# --- 研究方向 ---
research_areas:
  - title: Rare Event Searches
    icon: users # 对应 FontAwesome 或 Lucide 图标概念
    desc: >
      Leading the **Solar 8B CENS** analysis in XENONnT. 
      Achieved the first indication of solar neutrinos via CENS in a dark matter detector.
      Also working on Light WIMP searches and investigating the "Neutrino Fog".
  
  - title: Background Modeling & Detector R&D
    icon: filter
    desc: >
      Developed a precision model for **Accidental Coincidence (AC)** backgrounds, suppressing them by orders of magnitude.
      Engaged in R&D for Radon daughter plate-out on LXe electrodes and commissioned the LXe circulation system at Tsinghua.

